<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Catalogue de Jeux Débloqués</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff4757;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        /* Conteneur de la grille de jeux */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 40px auto;
        }

        /* Style des cartes de jeux */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 8px 15px rgba(255, 71, 87, 0.2);
        }

        .game-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #333;
        }

        .game-card p {
            margin: 0;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* Zone d'affichage du jeu actif */
        .game-container {
            display: none; /* Caché au début */
            max-width: 1000px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .game-title {
            margin: 0;
            font-size: 1.5rem;
        }

        .close-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover {
            background-color: #e04050;
        }

        /* Rendre l'iframe responsive */
        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>🎮 Mon Espace Jeux Débloqués</h1>

    <!-- La grille qui affiche tous les jeux de vos données -->
    <div class="games-grid" id="catalog"></div>

    <!-- Le lecteur où se lancera le jeu sélectionné -->
    <div class="game-container" id="player-zone">
        <div class="game-header">
            <h2 class="game-title" id="current-title">Nom du jeu</h2>
            <button class="close-btn" onclick="closeGame()">❌ Fermer le jeu</button>
        </div>
        <div class="iframe-wrapper" id="iframe-target"></div>
    </div>

    <script>
        // Votre liste complète convertie en objet JavaScript utilisable
        const gamesData = [
            { "name": "Retro Bowl", "url": "https://hfmanor.com/retro-bowl", "icon": "https://hfmanor.com/image/retro-bowl" },
            { "name": "Subway Surfers", "url": "https://hfmanor.com/subway-surfers", "icon": "https://hfmanor.com/image/subway-surfers" },
            { "name": "Basketball Stars", "url": "https://hfmanor.com/basketball-stars", "icon": "https://hfmanor.com/image/basketball-stars" },
            { "name": "Basket Random", "url": "https://hfmanor.com/basket-random", "icon": "https://hfmanor.com/image/basket-random" },
            { "name": "Stickman Hook", "url": "https://hfmanor.com/stickman-hook", "icon": "https://hfmanor.com/image/stickman-hook" },
            { "name": "Smash Karts", "url": "https://hfmanor.com/Smash Karts", "icon": "https://hfmanor.com/image/Smash Karts" },
            { "name": "Cookie Clicker", "url": "https://hfmanor.com/cookie-clicker", "icon": "https://hfmanor.com/image/cookie-clicker" },
            { "name": "Moto X3M", "url": "https://hfmanor.com/moto-X3M", "icon": "https://hfmanor.com/image/moto-X3M" },
            { "name": "Bitlife", "url": "https://hfmanor.com/bitlife", "icon": "https://hfmanor.com/image/bitlife" },
            { "name": "Superhot", "url": "https://hfmanor.com/superhot", "icon": "https://hfmanor.com/image/superhot" },
            { "name": "1v1lol", "url": "https://hfmanor.com/1v1lol", "icon": "https://hfmanor.com/image/1v1lol" },
            { "name": "Roblox", "url": "https://hfmanor.com/roblox", "icon": "https://hfmanor.com/image/roblox" },
            { "name": "Among Us", "url": "https://hfmanor.com/among-us", "icon": "https://hfmanor.com/image/among-us" },
            { "name": "Snow Rider 3D", "url": "https://games.mathpapers.org/snowrider3d/index.html", "icon": "https://hfmanor.com/image/Snow Rider 3D" },
            { "name": "Minecraft", "url": "https://hfmanor.com/Minecraft", "icon": "https://hfmanor.com/image/Minecraft" },
            { "name": "Soundboard", "url": "https://hfmanor.com/soundboard", "icon": "https://hfmanor.com/image/soundboard" }
        ];

        const catalog = document.getElementById('catalog');
        const playerZone = document.getElementById('player-zone');
        const currentTitle = document.getElementById('current-title');
        const iframeTarget = document.getElementById('iframe-target');

        // Génération automatique des boutons visuels pour chaque jeu
        gamesData.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => loadGame(game.name, game.url);

            // Structure interne de la vignette (Image + Texte)
            card.innerHTML = `
                <img src="${game.icon}" alt="${game.name}" onerror="this.src='https://placehold.co🎮'">
                <p>${game.name}</p>
            `;
            catalog.appendChild(card);
        });

        // Fonction pour lancer un jeu
        function loadGame(name, url) {
            currentTitle.textContent = name;
            // Création de l'iframe sécurisée
            iframeTarget.innerHTML = `<iframe src="${url}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            playerZone.style.display = 'block'; // Affiche le lecteur
            playerZone.scrollIntoView({ behavior: 'smooth' }); // Aligne la caméra sur le jeu

            // Tentative globale d'Unlock All via les variables courantes du localStorage au chargement
            localStorage.setItem('subway_surfers_coins', '9999999');
            localStorage.setItem('subway_surfers_keys', '9999');
        }

        // Fonction pour quitter et couper le son du jeu en cours
        function closeGame() {
            iframeTarget.innerHTML = '';
            playerZone.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
